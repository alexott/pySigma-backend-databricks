# Built-in Lakewatch profile for the sentinelone_deep_visibility parser (SentinelOne
# Deep Visibility / Singularity Data Lake events).
#
# Derived from pySigma-backend-panther, sigma/pipelines/panther/sentinelone_panther_pipeline.py
# (Apache-2.0, Copyright 2023 Panther Labs, Inc.; see THIRD_PARTY_NOTICES). The field groups and the
# event-type conditions are ported, with these changes:
#   * Panther's EventType/ObjectType conditions become event_type conditions (see below).
#   * Panther's `pipe_creation` block is removed (see below).
#   * CurrentDirectory, Product, record_type and Protocol are `unsupported` (Panther mapped
#     CurrentDirectory onto the image path and Product onto the display name, which changes the
#     meaning of the rule). The converter drops an unsupported field where that only narrows the
#     rule, and fails the rule otherwise (under a negation, or nothing left). Every dropped field
#     is reported (warning, `pruned` in the report, `sigma_pruned_fields` annotation), and
#     `-O prune_unsupported=false` fails the rule instead.
#   * User and ParentUser are added: in process_creation User is tgt_process_user (the new
#     process) and ParentUser is src_process_user; in the other blocks User is src_process_user
#     (the acting process). Panther did not map ParentUser, and mapped User only in some groups.
#   * file_event is narrowed to the `File Creation` event type (Sysmon FileCreate); Panther
#     selected every file event (ObjectType File). The other file event types have their own
#     categories (file_change, file_rename, file_delete).
#   * Details (registry_set) rejects Sysmon-style numeric/binary values (DWORD (0x...),
#     QWORD (0x...), Binary Data), which registry_value, compared as text, never matches.
#   * Hashes is mapped per algorithm; OriginalFileName is unsupported in process_creation
#     (tgt_process has no originalFileName column).
#   * network_connection is outbound-only, see below. DestinationHostname is unsupported there:
#     hostnames live on DNS/Url events, which an outbound IP Connect selector never matches.
#
# Enum verification (2026-11-25). Every selector below uses an event.type value listed in the
# SentinelOne powerquery field reference
# https://github.com/Sentinel-One/ai-siem/blob/main/plugins/s1-secops-skills/skills/powerquery/references/fields-and-schema.md
# (event.type: Process Creation, File Creation, File Deletion, File Modification, File Rename,
# Registry Value Modified, IP Connect, DNS Resolved, Module Load; event.category: process, file,
# network, logins; event.network.direction: INCOMING, OUTGOING). The endpoint_os product values
# (windows, linux, osx) are from Panther, unverified: the reference does not list them.
# Sources per selector:
#   process_creation: event_type Process Creation        file_event: File Creation
#   file_change: File Modification   file_rename: File Rename   file_delete: File Deletion
#   image_load: Module Load          registry_set: Registry Value Modified
#   dns_query, dns: DNS Resolved     network_connection, firewall: IP Connect + OUTGOING
# Corrections to Panther: `File Delete` is `File Deletion`; `ModuleLoad` is `Module Load`;
# Panther's category-based selectors (ObjectType File/Registry/DNS/Url/IP) are replaced by the
# event types above, because the reference lists the categories as process/file/network/logins.
# REMOVED, awaiting verification against real data (their rules fail with the no-profile
# reason): pipe_created (`Named Pipe Creation` is unverified), registry_add, registry_delete and
# registry_event (only `Registry Value Modified` is verified).
# The hive format of registry_keyPath (TargetObject is compared as written, e.g. HKLM\...
# versus \REGISTRY\MACHINE\...) is unverified, so no hive rewrite is applied.
#
# Network direction: the reference describes src.ip.address as the "process side" address, so
# S1 src/dst look like local/remote, not initiator/responder (no explicit statement was found).
# As for CrowdStrike, network_connection is outbound-only (event_network_direction = OUTGOING)
# and `Initiated: 'false'` fails the rule.
profile: sentinelone_deep_visibility
version: 1
parser: sentinelone_deep_visibility
entity: endpoint_name
products:
  windows:
    endpoint_os: windows
  linux:
    endpoint_os: linux
  macos:
    endpoint_os: osx
logsources:
  - match:
      category: process_creation
    conditions:
      event_type: Process Creation
    fields:
      ProcessId: tgt_process_pid
      Image: tgt_process_image_path
      Description: tgt_process_displayName
      Company: tgt_process_publisher
      CommandLine: tgt_process_cmdline
      User: tgt_process_user
      TerminalSessionId: tgt_process_sessionId
      IntegrityLevel: tgt_process_integrityLevel
      md5: tgt_process_image_md5
      sha1: tgt_process_image_sha1
      sha256: tgt_process_image_sha256
      Hashes:
        transform:
          hashes:
            algos:
              MD5: tgt_process_image_md5
              SHA1: tgt_process_image_sha1
              SHA256: tgt_process_image_sha256
      ParentProcessId: src_process_pid
      ParentImage: src_process_image_path
      ParentCommandLine: src_process_cmdline
      ParentUser: src_process_user
    unsupported:
      - CurrentDirectory
      - Product
      - OriginalFileName
  - match:
      category: file_event
    conditions:
      event_type: File Creation
    fields:
      Image: src_process_image_path
      CommandLine: src_process_cmdline
      ParentImage: src_process_parent_image_path
      ParentCommandLine: src_process_parent_cmdline
      TargetFilename: tgt_file_path
      SourceFilename: tgt_file_oldPath
      User: src_process_user
  - match:
      category: file_change
    conditions:
      event_type: File Modification
    fields:
      Image: src_process_image_path
      CommandLine: src_process_cmdline
      ParentImage: src_process_parent_image_path
      ParentCommandLine: src_process_parent_cmdline
      TargetFilename: tgt_file_path
      SourceFilename: tgt_file_oldPath
      User: src_process_user
  - match:
      category: file_rename
    conditions:
      event_type: File Rename
    fields:
      Image: src_process_image_path
      CommandLine: src_process_cmdline
      ParentImage: src_process_parent_image_path
      ParentCommandLine: src_process_parent_cmdline
      TargetFilename: tgt_file_path
      SourceFilename: tgt_file_oldPath
      User: src_process_user
  - match:
      category: file_delete
    conditions:
      event_type: File Deletion
    fields:
      Image: src_process_image_path
      CommandLine: src_process_cmdline
      ParentImage: src_process_parent_image_path
      ParentCommandLine: src_process_parent_cmdline
      TargetFilename: tgt_file_path
      SourceFilename: tgt_file_oldPath
      User: src_process_user
  - match:
      category: image_load
    conditions:
      event_type: Module Load
    fields:
      Image: src_process_image_path
      CommandLine: src_process_cmdline
      ParentImage: src_process_parent_image_path
      ParentCommandLine: src_process_parent_cmdline
      User: src_process_user
      ImageLoaded: module_path
      sha1: module_sha1
      md5: module_md5
      Hashes:
        transform:
          hashes:
            algos:
              MD5: module_md5
              SHA1: module_sha1
  - match:
      category: registry_set
    conditions:
      event_type: Registry Value Modified
    fields:
      Image: src_process_image_path
      CommandLine: src_process_cmdline
      ParentImage: src_process_parent_image_path
      ParentCommandLine: src_process_parent_cmdline
      User: src_process_user
      TargetObject: registry_keyPath
      # Sysmon-style numeric and binary values (DWORD (0x...), QWORD (0x...), Binary Data) fail
      # the rule: registry_value is compared as text and would never match them.
      Details:
        field: registry_value
        transform:
          reject:
            pattern: '^\*?(DWORD|QWORD) \(|^\*?Binary Data|^\*?\(?0x[0-9a-f]{1,16}\)?\*?$'
            reason: numeric/binary registry values are not stored as text in sentinelone_deep_visibility
  - match:
      category: dns_query
    conditions:
      event_type: DNS Resolved
    fields:
      Image: src_process_image_path
      CommandLine: src_process_cmdline
      ParentImage: src_process_parent_image_path
      ParentCommandLine: src_process_parent_cmdline
      User: src_process_user
      query: event_dns_request
      answer: event_dns_response
      QueryName: event_dns_request
    unsupported:
      - record_type
  - match:
      category: dns
    conditions:
      event_type: DNS Resolved
    fields:
      Image: src_process_image_path
      CommandLine: src_process_cmdline
      ParentImage: src_process_parent_image_path
      ParentCommandLine: src_process_parent_cmdline
      User: src_process_user
      query: event_dns_request
      answer: event_dns_response
      QueryName: event_dns_request
    unsupported:
      - record_type
  # Outbound connections only; see the header.
  - match:
      category: network_connection
    conditions:
      event_type: IP Connect
      event_network_direction: OUTGOING
    fields:
      Image: src_process_image_path
      CommandLine: src_process_cmdline
      ParentImage: src_process_parent_image_path
      ParentCommandLine: src_process_parent_cmdline
      DestinationPort: dst_port_number
      DestinationIp: dst_ip_address
      User: src_process_user
      SourceIp: src_ip_address
      SourcePort: src_port_number
      dst_ip: dst_ip_address
      src_ip: src_ip_address
      dst_port: dst_port_number
      src_port: src_port_number
      Initiated:
        select_condition:
          'true':
            event_network_direction: OUTGOING

    unsupported:
      - Protocol
      - DestinationHostname
  - match:
      category: firewall
    conditions:
      event_type: IP Connect
      event_network_direction: OUTGOING
    fields:
      Image: src_process_image_path
      CommandLine: src_process_cmdline
      ParentImage: src_process_parent_image_path
      ParentCommandLine: src_process_parent_cmdline
      DestinationPort: dst_port_number
      DestinationIp: dst_ip_address
      User: src_process_user
      SourceIp: src_ip_address
      SourcePort: src_port_number
      dst_ip: dst_ip_address
      src_ip: src_ip_address
      dst_port: dst_port_number
      src_port: src_port_number
      Initiated:
        select_condition:
          'true':
            event_network_direction: OUTGOING

    unsupported:
      - Protocol
      - DestinationHostname
