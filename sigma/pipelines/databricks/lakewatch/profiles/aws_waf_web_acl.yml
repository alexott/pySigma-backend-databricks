# Built-in Lakewatch profile for the aws_waf_web_acl parser (AWS WAF web ACL logs).
# Field-name sources: AWS WAF log field reference, the W3C Extended Log File Format for the
# cs-/sc- names, and the SigmaHQ corpus for aliases.
# No LGPL Sigma pipeline source was used.
#
# Alias notes:
# - cs-uri-query holds the whole request URI in SigmaHQ rules, but this parser stores the path and the
#   query in two fields (httpRequest.uri and httpRequest.args), so it maps to both (ORed). contains and
#   endswith match the part that holds the value; contains|all may match its values across the two
#   parts (an accepted approximation). A value with a literal ? or a ? wildcard can't match, because
#   no single column holds both sides, so the reject transform fails that rule.
# - cs-uri-stem maps to httpRequest.uri.
# - sc-status is unmapped: WAF logs only the action and responseCodeSent (the code WAF itself sent),
#   not the origin status.
# - cs-user-agent, cs-referer and cs-host are unsupported: the request headers are an array inside the
#   httpRequest VARIANT (httpRequest.headers), which can't be queried by path. They fail with a clear
#   message. cs-username and cs-content-type are unmapped: nothing equivalent is logged.
# - httpRequest declares children, so it gets a bare line and no prefix line. labels ([{name}]) and
#   requestHeadersInserted ([{name, value}]) are VARIANT columns that hold arrays, so they get bare
#   lines only and no prefix line: they can only be queried as a whole value with |contains, and a
#   member such as labels.name is not mapped.
# - Dropped from the scaffold: httpRequest.headers.name and .value (array paths inside a VARIANT) and
#   the ARRAY columns (nonTerminatingMatchingRules, rateBasedRuleList, ruleGroupList,
#   terminatingRuleMatchDetails) with their members.
profile: aws_waf_web_acl
version: 1
parser: aws_waf_web_acl
entity: httpRequest.clientIp
transforms:
  split_uri: {reject: {pattern: '\?', reason: path and query are separate columns in this parser}}
fields:
  action: action
  formatVersion: formatVersion
  httpRequest: httpRequest
  httpRequest.args: httpRequest.args
  httpRequest.clientIp: httpRequest.clientIp
  httpRequest.country: httpRequest.country
  httpRequest.httpMethod: httpRequest.httpMethod
  httpRequest.httpVersion: httpRequest.httpVersion
  httpRequest.requestId: httpRequest.requestId
  httpRequest.uri: httpRequest.uri
  httpSourceId: httpSourceId
  httpSourceName: httpSourceName
  labels: labels
  requestHeadersInserted: requestHeadersInserted
  responseCodeSent: responseCodeSent
  terminatingRuleId: terminatingRuleId
  terminatingRuleType: terminatingRuleType
  webaclId: webaclId
  cs-uri-query:
    field: [httpRequest.uri, httpRequest.args]
    transform: split_uri
  cs-uri-stem: httpRequest.uri
  cs-method: httpRequest.httpMethod
logsources:
  - match: {category: webserver}
    unsupported: [cs-user-agent, cs-referer, cs-host]
