# Built-in Lakewatch profile for the microsoft365_audit_exchange parser (Office 365 audit records of
# the Exchange workload).
# Field-name sources: the Office 365 Management Activity API schema and the SigmaHQ corpus for
# aliases.
# No LGPL Sigma pipeline source was used.
#
# Alias notes:
# - Parameters is an array of {Name, Value}. Sigma rules write Parameters|contains: DeleteMessage
#   for a parameter *name*, so Parameters maps to both Parameters.Name and Parameters.Value
#   (ORed, any element).
# - eventSource, eventName and status are the ECS names that rules for service: exchange use for
#   Workload, Operation and ResultStatus. status: success matches the ResultStatus spellings
#   True, Succeeded and Success (ORed, case-insensitive).
# - OperationProperties is unmapped on purpose: it is not in this schema.
profile: microsoft365_audit_exchange
version: 1
parser: microsoft365_audit_exchange
entity: UserId
fields:
  AffectedItems.Attachments: AffectedItems.Attachments
  AffectedItems.Id: AffectedItems.Id
  AffectedItems.ParentFolder.FolderItems.ClientRequestId: AffectedItems.ParentFolder.FolderItems.ClientRequestId
  AffectedItems.ParentFolder.FolderItems.CreationTime: AffectedItems.ParentFolder.FolderItems.CreationTime
  AffectedItems.ParentFolder.FolderItems.Id: AffectedItems.ParentFolder.FolderItems.Id
  AffectedItems.ParentFolder.FolderItems.ImmutableId: AffectedItems.ParentFolder.FolderItems.ImmutableId
