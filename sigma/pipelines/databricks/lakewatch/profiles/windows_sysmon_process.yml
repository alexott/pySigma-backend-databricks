# Built-in Lakewatch profile for the windows_sysmon_process parser: Sysmon process events (Sysmon EventIDs 1, 5, 6, 7, 8, 9, 10, 25).
# Note: requires the custom Windows parsers (lakewatch parser-generators/windows); not a
# Lakewatch built-in yet.
#
# Field-name source: the Sysmon configuration schema ("sysmon -s", schema version 4.90, Sysmon 15),
# as published in Microsoft's SysmonCommon manifest
# (https://github.com/microsoft/SysmonCommon/blob/main/manifest.xml) and a public copy of the
# "sysmon -s" 4.90 dump
# (https://gist.github.com/olafhartong/328474bf273842c20a162c015f09bd61), which also covers
# EventIDs 27-29. Event descriptions and the category -> EventID mapping follow
# https://learn.microsoft.com/sysinternals/downloads/sysmon. Field names are facts of the Sysmon
# schema; no LGPL Sigma pipeline source was used.
#
# The Sysmon fields live in EventData as named entries ({_Name, _VALUE}); each EventData name
# listed under `event_data` maps to EventData[<name>]. Values pass through unchanged (Sigma's
# Sysmon taxonomy is Sysmon's own). EventID is a STRING column.
profile: windows_sysmon_process
version: 1
parser: windows_sysmon_process
entity: Computer
raw:
  entries: EventData
fields:
  EventID: EventID
  Channel: Channel
  Computer: Computer
  Provider_Name: Provider
  Level: Level
  Message: Message
  Keywords: Keywords
  Task: Task
  Opcode: Opcode
  UserID: UserID
  Version: Version
  EventRecordID: EventRecordID
logsources:
  - match:
      product: windows
      category: process_creation
    conditions:
      EventID: '1'
    event_data: [RuleName, UtcTime, ProcessGuid, ProcessId, Image, FileVersion, Description, Product, Company, OriginalFileName, CommandLine, CurrentDirectory, User, LogonGuid, LogonId, TerminalSessionId, IntegrityLevel, Hashes, ParentProcessGuid, ParentProcessId, ParentImage, ParentCommandLine, ParentUser]
  - match:
      product: windows
      category: process_termination
    conditions:
      EventID: '5'
    event_data: [RuleName, UtcTime, ProcessGuid, ProcessId, Image, User]
  - match:
      product: windows
      category: driver_load
    conditions:
      EventID: '6'
    event_data: [RuleName, UtcTime, ImageLoaded, Hashes, Signed, Signature, SignatureStatus]
  - match:
      product: windows
      category: image_load
    conditions:
      EventID: '7'
    event_data: [RuleName, UtcTime, ProcessGuid, ProcessId, Image, ImageLoaded, FileVersion, Description, Product, Company, OriginalFileName, Hashes, Signed, Signature, SignatureStatus, User]
  - match:
      product: windows
      category: create_remote_thread
    conditions:
      EventID: '8'
    event_data: [RuleName, UtcTime, SourceProcessGuid, SourceProcessId, SourceImage, TargetProcessGuid, TargetProcessId, TargetImage, NewThreadId, StartAddress, StartModule, StartFunction, SourceUser, TargetUser]
  - match:
      product: windows
      category: raw_access_thread
    conditions:
      EventID: '9'
    event_data: [RuleName, UtcTime, ProcessGuid, ProcessId, Image, Device, User]
  - match:
      product: windows
      category: process_access
    conditions:
      EventID: '10'
    event_data: [RuleName, UtcTime, SourceProcessGUID, SourceProcessId, SourceThreadId, SourceImage, TargetProcessGUID, TargetProcessId, TargetImage, GrantedAccess, CallTrace, SourceUser, TargetUser]
  - match:
      product: windows
      category: process_tampering
    conditions:
      EventID: '25'
    event_data: [RuleName, UtcTime, ProcessGuid, ProcessId, Image, Type, User]
  - match:
      product: windows
      service: sysmon
    route:
      field: EventID
    event_data: any
